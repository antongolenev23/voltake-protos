syntax = "proto3";

package auth.v1;

option go_package = "github.com/antongolenev23/voltake-protos/gen/go/auth/v1;authv1";

service Auth {
    rpc Register(Credentials) returns (AuthResponse); 
    rpc Login(Credentials) returns (AuthResponse);
}

message Credentials {
    string email = 1;
    string password = 2;
}

message AuthResponse {
    string token = 2;
}
